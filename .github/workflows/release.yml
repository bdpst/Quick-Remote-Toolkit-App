name: Windows Rust build
on:
  push:
    branches: [main, codex/rust-rewrite]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Select toolchain
        run: rustup default 1.99.1
      - name: Formatting
        run: cargo fmt --check --manifest-path src/QuickRemoteToolkit.Rust/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path src/QuickRemoteToolkit.Rust/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path src/QuickRemoteToolkit.Rust/Cargo.toml
      - name: Portable release
        shell: pwsh
        run: ./src/QuickRemoteToolkit.Rust/build.ps1 -OutputDirectory ./publish-rust
      - uses: actions/upload-artifact@v4
        with:
          name: QuickRemoteToolkit.Rust-win-x64
          path: publish-rust/QuickRemoteToolkit.Rust-win-x64.zip
