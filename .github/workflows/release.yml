name: Windows Rust build
on:
  push:
    branches: [main, codex/rust-rewrite]
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Select toolchain
        run: rustup default 1.99.1
      - name: Formatting
        run: cargo fmt --check --manifest-path src/QuickRemoteToolkit.Rust/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path src/QuickRemoteToolkit.Rust/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path src/QuickRemoteToolkit.Rust/Cargo.toml
      - name: QA host lint
        run: cargo clippy --locked --manifest-path src/QuickRemoteToolkit.Rust/Cargo.toml --features ui-qa --bin qrt-ui-qa -- -D warnings
      - name: Portable release
        shell: pwsh
        run: ./src/QuickRemoteToolkit.Rust/build.ps1 -OutputDirectory ./publish-rust
      - name: Inspect Windows package
        run: python ./src/QuickRemoteToolkit.Rust/tests/verify-artifact.py ./publish-rust/QuickRemoteToolkitRust.exe ./publish-rust/QuickRemoteToolkit.Rust-win-x64.zip ./publish-rust/validation.json --commit ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: QuickRemoteToolkit.Rust-win-x64
          path: |
            publish-rust/QuickRemoteToolkit.Rust-win-x64.zip
            publish-rust/SHA256SUMS
            publish-rust/BUILD-INFO.json
            publish-rust/validation.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QuickRemoteToolkit.Rust-win-x64
          path: dist
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python -c 'import json,os; b=json.load(open("dist/BUILD-INFO.json")); assert b["version"]==os.environ["RELEASE_TAG"].removeprefix("v"); assert b["commit"]==os.environ["RELEASE_COMMIT"]; assert b["source_dirty"] is False'
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" --title "Quick Remote Toolkit $version" --notes-file "docs/releases/$version.md" --latest dist/QuickRemoteToolkit.Rust-win-x64.zip dist/SHA256SUMS dist/BUILD-INFO.json
